name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: vipinpra09
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23ff0000&color_dots=%23ebedf0,%23ebedf0,%23ebedf0,%23ebedf0,%23ebedf0
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=%23ff0000&color_dots=%23ebedf0,%23ebedf0,%23ebedf0,%23ebedf0,%23ebedf0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
