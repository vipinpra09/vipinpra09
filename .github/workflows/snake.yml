name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: vipinpra09
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%237c3aed&color_dots=%23f3f4f6,%23d1d5db,%239ca3af,%236b7280,%234b5563
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2322d3ee&color_dots=%23111827,%231f2937,%23374151,%234b5563,%236b7280

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
